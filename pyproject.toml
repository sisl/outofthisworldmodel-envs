[project]
name = "owm-envs"
version = "0.1.0"
description = "Training data environments for the Out of this World Model (OWM) world model"
requires-python = ">=3.11"
dependencies = [
    "astrojax>=0.8.0",
    "jax[cuda13]>=0.4.30",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
render = ["pygfx==0.15.2", "pylinalg", "imageio", "pillow", "trimesh"]
# Floor at 0.4.4: datasets/lerobot_writer.py was written against the 0.4.x
# API (create(), the feature schema, add_frame, the (1, 1) feature-shape
# workaround); 0.5.x keeps that surface and writes the same v3.0 on-disk
# layout, verified by loading a 0.4.4-written run with 0.5.1. uv.lock holds
# the development version; consumers may resolve newer releases.
# huggingface-hub is named here as well as reached through lerobot:
# datasets/hub.py imports it directly, and a dependency this package calls
# itself must not be one lerobot is free to drop.
# plotly and matplotlib are not used by the package itself:
# scripts/plot_trajectories_3d.py reads a written run's parquet and renders
# it, so it needs whatever reads those files, and this is the extra that
# supplies them.
datasets = ["lerobot>=0.4.4", "huggingface-hub>=0.34.2", "plotly>=6.0", "matplotlib>=3.9"]

[project.scripts]
owm-envs = "owm_envs._entry:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owm_envs"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
