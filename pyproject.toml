[project]
name = "owm-envs"
version = "0.1.0"
description = "Training data environments for the Out of this World Model (OWM) world model"
requires-python = ">=3.11"
dependencies = [
    "astrojax>=0.8.0",
    "jax>=0.4.30",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
render = ["pygfx==0.15.2", "pylinalg", "imageio", "pillow", "trimesh"]
# Bounded below 0.5: datasets/lerobot_writer.py targets the 0.4.x API and
# depends on version-specific behaviour of create(), the feature schema, and
# add_frame -- including the (1, 1) feature shapes, which are a workaround for
# how this version converts declared shapes to HuggingFace types. uv.lock
# holds 0.4.4 for development, but a published install resolves afresh and
# would otherwise be free to take a release that changes any of that.
# huggingface-hub is named here as well as reached through lerobot:
# datasets/hub.py imports it directly, and a dependency this package calls
# itself must not be one lerobot is free to drop.
datasets = ["lerobot>=0.4.4,<0.5", "huggingface-hub>=0.34.2"]

[project.scripts]
owm-envs = "owm_envs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owm_envs"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
