[project]
name = "owm-envs"
version = "0.1.0"
description = "Training data environments for the Out of this World Model (OWM) world model"
# >=3.12 because the datasets extra pins lerobot 0.6.1, which requires it.
# Leaving 3.11 open is what let an install silently resolve a different
# lerobot -- and a different on-disk dataset format -- than the one this
# package is written against.
requires-python = ">=3.12"
dependencies = [
    "astrojax>=0.8.0",
    "jax>=0.4.30",
    "gymnasium>=1.0",
    "numpy>=1.26",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "tomli-w>=1.0",
    "typer>=0.12",
]

[project.optional-dependencies]
render = ["pygfx==0.15.2", "pylinalg", "imageio", "pillow", "trimesh"]
# Pinned exactly: datasets/lerobot_writer.py depends on version-specific
# behaviour of create(), the feature schema, add_frame and finalize() --
# including the (1, 1) feature shapes, which are a workaround for how this
# version converts declared shapes to HuggingFace types. The consumer of
# these datasets (quickdraw) pins the same version; the two must agree,
# because lerobot's on-disk format is versioned independently of its API and
# a reader on a different release can find a layout it does not know.
# huggingface-hub is named here as well as reached through lerobot:
# datasets/hub.py imports it directly, and a dependency this package calls
# itself must not be one lerobot is free to drop.
# plotly is not used by the package itself: scripts/plot_trajectories_3d.py
# reads a written run's parquet and renders it, so it needs whatever reads
# those files, and this is the extra that supplies them.
datasets = ["lerobot[dataset]==0.6.1", "huggingface-hub>=0.34.2", "plotly>=6.0"]

[project.scripts]
owm-envs = "owm_envs.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/owm_envs"]

[dependency-groups]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
