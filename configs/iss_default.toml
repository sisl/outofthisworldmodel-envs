dt = 0.05
max_steps = 2000

[physics]
mass = 12000.0
inertia_diag = [
    80000.0,
    80000.0,
    50000.0,
]
linear_damping = 0.0
angular_damping = 0.0
dragon_collision_radius_m = 2.25
start_radius_m = 100.0
collision_boxes_path = "collision_boxes.yaml"

[control]
limit_force_n = 18000.0
limit_torque_nm = 90000.0

[dock]
position = [
    0.225,
    -24.5,
    -2.5,
]
quaternion = [
    0.7071068,
    -0.7071068,
    0.0,
    0.0,
]
enabled = true
max_distance_m = 0.1
max_velocity_m_s = 0.5
max_attitude_error_deg = 5.0
max_body_rate_rad_s = 0.008727

[reward_weights]
position = -1.0
velocity = -0.35
angular_velocity = -0.1
control_effort = -0.05
collision = -1000000.0

# HCW relative orbital dynamics + gravity-gradient torque. Disabled by
# default (enabled = false reproduces the physics above exactly). Uncomment
# to turn on CW accelerations, gravity-gradient torque, and per-episode
# start-time sampling. When rendering (`--render`), the CLI also makes the
# renderer's sun direction and Earth spin follow this epoch automatically,
# unless render.sun_from_epoch is set explicitly in a render config block
# (see README "Orbital dynamics").
